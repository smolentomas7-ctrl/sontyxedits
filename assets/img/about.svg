<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="">
  <defs>
    <radialGradient id="bg" cx="58%" cy="48%" r="72%">
      <stop offset="0%"   stop-color="#14141c"/>
      <stop offset="55%"  stop-color="#0a0a10"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7df4ff"/>
      <stop offset="50%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>

    <linearGradient id="glassFill" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#9fe9ff" stop-opacity="0.38"/>
    </linearGradient>

    <filter id="bigGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- ambient haze -->
  <ellipse cx="560" cy="500" rx="330" ry="300" fill="#22d3ee" opacity="0.14" filter="url(#haze)"/>
  <ellipse cx="430" cy="640" rx="230" ry="210" fill="#0a84ff" opacity="0.12" filter="url(#haze)"/>

  <!-- ══ film ribbons ══ -->
  <g>
    <!-- back ribbon -->
    <g transform="rotate(-24 500 500)" opacity="0.85">
      <ellipse cx="500" cy="500" rx="300" ry="176" fill="none" stroke="url(#cyan)"
               stroke-width="46" stroke-dasharray="40 9" opacity="0.5" filter="url(#bigGlow)"/>
      <ellipse cx="500" cy="500" rx="300" ry="176" fill="none" stroke="url(#cyan)"
               stroke-width="44" stroke-dasharray="40 9"/>
      <ellipse cx="500" cy="500" rx="300" ry="176" fill="none" stroke="#07070c"
               stroke-width="26" stroke-dasharray="40 9"/>
    </g>

    <!-- front ribbon -->
    <g transform="rotate(28 500 500)" opacity="0.9">
      <ellipse cx="500" cy="510" rx="248" ry="142" fill="none" stroke="url(#cyan)"
               stroke-width="40" stroke-dasharray="34 8" opacity="0.45" filter="url(#bigGlow)"/>
      <ellipse cx="500" cy="510" rx="248" ry="142" fill="none" stroke="url(#cyan)"
               stroke-width="38" stroke-dasharray="34 8"/>
      <ellipse cx="500" cy="510" rx="248" ry="142" fill="none" stroke="#07070c"
               stroke-width="22" stroke-dasharray="34 8"/>
    </g>
  </g>

  <!-- ══ glass panels ══ -->
  <g>
    <g transform="rotate(-7 470 400)">
      <rect x="352" y="286" width="238" height="286" rx="30"
            fill="url(#glassFill)" stroke="url(#glassEdge)" stroke-width="1.6"/>
      <path d="M372 566 Q430 470 560 452" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="16"/>
    </g>

    <g transform="rotate(6 640 380)">
      <rect x="540" y="256" width="226" height="272" rx="30"
            fill="url(#glassFill)" stroke="url(#glassEdge)" stroke-width="1.6"/>
      <path d="M560 500 Q620 410 742 396" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="14"/>
    </g>

    <!-- hero panel, front -->
    <g transform="rotate(-3 512 560)">
      <rect x="386" y="404" width="274" height="330" rx="34"
            fill="url(#glassFill)" stroke="url(#glassEdge)" stroke-width="1.8"/>
      <ellipse cx="524" cy="596" rx="104" ry="62" fill="none" stroke="#7df4ff"
               stroke-opacity="0.42" stroke-width="7" filter="url(#softGlow)"/>
      <ellipse cx="524" cy="596" rx="66" ry="40" fill="none" stroke="#22d3ee"
               stroke-opacity="0.34" stroke-width="5" filter="url(#softGlow)"/>
      <path d="M404 712 Q470 600 640 566" fill="none" stroke="#ffffff" stroke-opacity="0.11" stroke-width="20"/>
    </g>
  </g>

  <!-- ══ particles ══ -->
  <g fill="#dff8ff">
    <rect x="300" y="224" width="11" height="6" rx="2" opacity="0.55"/>
    <rect x="742" y="300" width="9"  height="5" rx="2" opacity="0.4"/>
    <rect x="268" y="470" width="7"  height="7" rx="2" opacity="0.5"/>
    <rect x="790" y="520" width="12" height="6" rx="2" opacity="0.45"/>
    <rect x="330" y="768" width="9"  height="5" rx="2" opacity="0.4"/>
    <rect x="700" y="742" width="10" height="6" rx="2" opacity="0.5"/>
    <rect x="620" y="200" width="6"  height="6" rx="2" opacity="0.35"/>
    <rect x="246" y="612" width="10" height="5" rx="2" opacity="0.3"/>
    <rect x="812" y="404" width="7"  height="7" rx="2" opacity="0.32"/>
    <rect x="450" y="812" width="8"  height="5" rx="2" opacity="0.35"/>
  </g>
</svg>
